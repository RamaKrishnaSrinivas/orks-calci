<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tailwind Calculator</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 min-h-dvh flex flex-col items-center justify-center p-4">
    <!-- Calculator Box -->
    <div class="bg-zinc-800 p-6 rounded-2xl shadow-2xl w-full max-w-[340px]">
        
        <!-- Display (C55) -->
        <input 
            type="text" 
            id="display" 
            readonly 
            class="w-full h-20 text-right text-4xl p-4 rounded-lg bg-slate-50 text-zinc-900 mb-6 focus:outline-none"
        >

        <!-- Button Grid -->
        <div class="grid grid-cols-5 gap-2">
            <button onclick="cleard()" class="bg-red-500 hover:bg-red-600 text-white font-bold py-4 rounded-xl transition-colors">MC</button>
            <button onclick="backspace()" class="bg-zinc-600 hover:bg-zinc-500 text-white font-bold py-4 rounded-xl transition-colors">⌫</button>
            <button onclick="btn('%')" class="bg-zinc-600 hover:bg-zinc-500 text-white font-bold py-4 rounded-xl transition-colors">%</button>
            <button onclick="btn('/')" class="bg-orange-500 hover:bg-orange-400 text-white font-bold py-4 rounded-xl transition-colors">/</button>

            <button onclick="btn('7')" class="bg-zinc-700 hover:bg-zinc-600 text-white font-bold py-4 rounded-xl transition-colors">7</button>
            <button onclick="btn('8')" class="bg-zinc-700 hover:bg-zinc-600 text-white font-bold py-4 rounded-xl transition-colors">8</button>
            <button onclick="btn('9')" class="bg-zinc-700 hover:bg-zinc-600 text-white font-bold py-4 rounded-xl transition-colors">9</button>
            <button onclick="btn('*')" class="bg-orange-500 hover:bg-orange-400 text-white font-bold py-4 rounded-xl transition-colors">*</button>

            <button onclick="btn('4')" class="bg-zinc-700 hover:bg-zinc-600 text-white font-bold py-4 rounded-xl transition-colors">4</button>
            <button onclick="btn('5')" class="bg-zinc-700 hover:bg-zinc-600 text-white font-bold py-4 rounded-xl transition-colors">5</button>
            <button onclick="btn('6')" class="bg-zinc-700 hover:bg-zinc-600 text-white font-bold py-4 rounded-xl transition-colors">6</button>
            <button onclick="btn('-')" class="bg-orange-500 hover:bg-orange-400 text-white font-bold py-4 rounded-xl transition-colors">-</button>

            <button onclick="btn('1')" class="bg-zinc-700 hover:bg-zinc-600 text-white font-bold py-4 rounded-xl transition-colors">1</button>
            <button onclick="btn('2')" class="bg-zinc-700 hover:bg-zinc-600 text-white font-bold py-4 rounded-xl transition-colors">2</button>
            <button onclick="btn('3')" class="bg-zinc-700 hover:bg-zinc-600 text-white font-bold py-4 rounded-xl transition-colors">3</button>
            <button onclick="btn('+')" class="bg-orange-500 hover:bg-orange-400 text-white font-bold py-4 rounded-xl transition-colors">+</button>

            <button onclick="square()" class="bg-sky-600 hover:bg-sky-500 text-white font-bold py-4 rounded-xl transition-colors text-sm">sqr</button>
            <button onclick="btn('0')" class="bg-zinc-700 hover:bg-zinc-600 text-white font-bold py-4 rounded-xl transition-colors">0</button>
            <button onclick="btn('.')" class="bg-zinc-700 hover:bg-zinc-600 text-white font-bold py-4 rounded-xl transition-colors">.</button>
            <button onclick="sum()" class="bg-green-600 hover:bg-green-500 text-white font-bold py-4 rounded-xl transition-colors">=</button>

            <button onclick="btn('<')" class="bg-zinc-600 hover:bg-zinc-500 text-white font-bold py-4 rounded-xl transition-colors">&lt;</button>
            <button onclick="btn('>')" class="bg-zinc-600 hover:bg-zinc-500 text-white font-bold py-4 rounded-xl transition-colors">&gt;</button>
            <button onclick="btn('==')" class="bg-zinc-600 hover:bg-zinc-500 text-white font-bold py-4 rounded-xl transition-colors">==</button>
            <button onclick="cube()" class="bg-sky-600 hover:bg-sky-500 text-white font-bold py-4 rounded-xl transition-colors text-sm">cube</button>
        </div>
    </div>

    <script>
        function btn(value) {
            var display = document.getElementById('display');
            display.value += value;
        }

        function cleard() {
            var display = document.getElementById('display');
            display.value = "";
        }

        function backspace() {
            let display = document.getElementById("display");
            display.value = display.value.slice(0, -1);
        }

        function cube() {
            var display = document.getElementById('display');
            display.value = (+display.value) ** 3;
        }

        function square() {
            var display = document.getElementById('display');
            display.value = (+display.value) ** 2;
        }

        function sum() {
            var display = document.getElementById('display');
            try {
                display.value = new Function("return " + display.value)();
            } catch (error) {
                display.value = "Error";
            }
        }

        document.addEventListener('keydown', function(e) {
            if ((e.key >= '0' && e.key <= '9') || ['+', '-', '*', '/', '.', '%', '<', '>'].includes(e.key)) {
                btn(e.key);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                sum();
            } else if (e.key === 'Backspace') {
                backspace();
            } else if (e.key === 'Escape') {
                cleard();
            }
        });
        if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(() => console.log('Service Worker Registered'))
      .catch((err) => console.log('Registration Failed', err));
  }
    </script>
</body>
</html>
